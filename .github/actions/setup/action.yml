# CI 各ジョブ共通の setup（pnpm + Node.js + 依存インストール）。
# ジョブが増えても各ジョブ先頭で `- uses: ./.github/actions/setup` 一行で済む。
# checkout はここに置けない（ローカル composite はリポが checkout 済みでないと
# 参照できないため）。checkout は呼び出し側ジョブの先頭に置くこと。
# アクションは SHA ピン＋バージョンコメント（更新は Dependabot が行う）。
name: setup
description: pnpm + Node.js をセットアップして依存をインストールする（CI 各ジョブ共通）
inputs:
  node-version:
    description: >-
      Node のバージョン（任意）。空なら .node-version を使う。
      engines の下限などをマトリクスで検査するときに渡す（例: 22.12.0）。
    default: ""
runs:
  using: composite
  steps:
    # pnpm を先に入れる（setup-node の cache: pnpm が pnpm を要求するため）
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    # node-version が空なら node-version-file が使われる（setup-node の仕様）
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ inputs.node-version }}
        node-version-file: .node-version
        cache: pnpm

    - name: Install
      run: pnpm install --frozen-lockfile
      shell: bash
